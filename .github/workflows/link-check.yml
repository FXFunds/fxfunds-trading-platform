name: Link check (alternate days)
on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check official links
        run: |
          {
            echo "FXFunds Trading Platform — official link check"
            echo "Last checked: $(date -u +%Y-%m-%d)"
            echo ""
            for url in \
              https://fxfunds.com/ \
              https://github.com/fxfunds/fxfunds-trading-platform \
              https://fxfunds-trading-platform.readthedocs.io \
              https://fxfunds.github.io/fxfunds-trading-platform/ \
              https://huggingface.co/datasets/FXFunds/fxfunds-market-categories \
              https://www.kaggle.com/datasets/fxfunds/fxfunds-market-categories; do
              code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 20 "$url" || echo "000")
              echo "$code  $url"
            done
          } > link-check.txt
          cat link-check.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add link-check.txt
          git diff --cached --quiet || git commit -m "chore: link check $(date -u +%Y-%m-%d)"
          git push
